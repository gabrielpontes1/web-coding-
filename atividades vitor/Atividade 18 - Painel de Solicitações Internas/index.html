<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Painel de Solicitações Internas</title>
</head>

<body>
  <header>
    <h1>Painel de Solicitações Internas</h1>
  </header>

  <main>
    <form action="" id="formulario">
      <label for="nome">Nome do solicitante</label>
      <input type="text" id="nome" name="nome" required>

      <label for="setor">Setor</label>
      <input type="text" id="setor" name="setor" required>

      <label for="titulo_solicita">Título da solicitação</label>
      <input type="text" id="titulo_solicita" name="titulo_solicita" required>

      <label for="categoria">Categoria</label>
      <select id="categoria" name="categoria" required>
        <option value="" disabled selected>Selecione uma categoria</option>
        <option value="Suporte Técnico">Suporte Técnico</option>
        <option value="Equipamento">Equipamento</option>
        <option value="Sistema">Sistema</option>
        <option value="Acesso">Acesso</option>
        <option value="Outros">Outros</option>
      </select>

      <label for="prioridade">Prioridade</label>
      <select id="prioridade" name="prioridade" required>
        <option value="" disabled selected>Selecione uma prioridade</option>
        <option value="Baixa">Baixa</option>
        <option value="Média">Média</option>
        <option value="Alta">Alta</option>
      </select>

      <label for="descricao">Descrição</label>
      <textarea id="descricao" name="descricao" rows="3" required></textarea>

      <button type="submit">Enviar</button>
    </form>

    <section id="indicadores">
      <div>Total: <span id="total">0</span></div>
      <div>Abertas: <span id="abertas">0</span></div>
      <div>Em atendimento: <span id="atendimento">0</span></div>
      <div>Concluídas: <span id="concluidas">0</span></div>
    </section>

    <ul id="lista"></ul>
    <p id="vazio">Nenhuma solicitação registrada.</p>
  </main>

  <footer></footer>
  <script src="script.js"></script>
</body>
</html>
